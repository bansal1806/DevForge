name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check backend
        run: npx tsc --noEmit -p backend

      # Includes migration tests: the real schema + migrations run against an
      # in-process Postgres (PGlite) to verify RLS, triggers and merge logic.
      - name: Backend tests
        run: npm test --workspace backend

      - name: Design token contrast (WCAG AA, both themes)
        run: npm run check:contrast --workspace frontend

      - name: Lint frontend
        run: npm run lint --workspace frontend

      - name: Build frontend
        run: npm run build --workspace frontend

  # Browser tests: the real frontend against a mocked API and a fake Supabase
  # project (no secrets, no network) — flows, keyboard access, axe-core on every
  # page in both themes, and layout at phone widths.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: End-to-end tests
        run: npm run test:e2e --workspace frontend
        env:
          CI: true

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
