name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check backend
        run: npx tsc --noEmit -p backend

      # Includes migration tests: the real schema + migrations run against an
      # in-process Postgres (PGlite) to verify RLS, triggers and merge logic.
      - name: Backend tests
        run: npm test --workspace backend

      - name: Design token contrast (WCAG AA, both themes)
        run: npm run check:contrast --workspace frontend

      - name: Lint frontend
        run: npm run lint --workspace frontend

      - name: Build frontend
        run: npm run build --workspace frontend
